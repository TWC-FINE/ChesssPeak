# Local development databases. Credentials come from .env (git-ignored): run `pnpm env:init` once.
# Ports are published on the loopback interface only.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run pnpm env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm env:init}
      POSTGRES_DB: ${POSTGRES_DB:-chessspeak}
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - chessspeak_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?run pnpm env:init}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?run pnpm env:init}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - chessspeak_mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chessspeak_pg:
  chessspeak_mongo:

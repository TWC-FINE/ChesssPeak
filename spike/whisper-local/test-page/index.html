<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChessSpeak · prueba del agente local</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; background: #12151a; color: #e6e9ee; max-width: 760px; margin: 24px auto; padding: 0 16px; }
      button, input { background: #2a313c; color: inherit; border: 1px solid #3a4352; border-radius: 6px; padding: 6px 12px; }
      input[type='text'] { width: 18em; }
      pre { background: #1b2028; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
      .ok { color: #3ecf8e; } .bad { color: #f06a6a; } .muted { color: #98a2b3; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Prueba del agente local</h1>
    <p class="muted">
      Esta página debe abrirse con Live Server en <code>http://127.0.0.1:5500</code> (o <code>http://localhost:5500</code>).
      Arranca antes el agente: <code>pnpm --filter @chessspeak/spike-whisper-local serve</code>.
    </p>

    <div class="row">
      <label>Agente <input id="agent" type="text" value="http://127.0.0.1:8765" /></label>
      <button id="health" type="button">Probar /health</button>
      <button id="silence" type="button">Enviar 1 s de silencio</button>
      <label>o un WAV <input id="file" type="file" accept=".wav,audio/wav" /></label>
    </div>

    <p id="summary" class="muted">Sin probar.</p>
    <pre id="log"></pre>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const base = () => $('agent').value.replace(/\/$/, '');
      const results = {};

      const wavOfSilence = (seconds) => {
        const n = 16000 * seconds;
        const buffer = new ArrayBuffer(44 + n * 2);
        const v = new DataView(buffer);
        const text = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
        text(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); text(8, 'WAVEfmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        text(36, 'data'); v.setUint32(40, n * 2, true);
        return new Blob([buffer], { type: 'audio/wav' });
      };

      const show = (label, value, ok) => {
        results[label] = { ok, value };
        $('log').textContent += `${label}\n${typeof value === 'string' ? value : JSON.stringify(value, null, 2)}\n\n`;
        const all = Object.values(results);
        $('summary').className = all.every((r) => r.ok) ? 'ok' : 'bad';
        $('summary').textContent = all.every((r) => r.ok)
          ? `✔ Funciona: ${Object.keys(results).join(' y ')} respondieron desde ${location.origin}.`
          : `✘ Falló: ${Object.entries(results).filter(([, r]) => !r.ok).map(([k]) => k).join(', ')}`;
        document.body.dataset.result = JSON.stringify(results);
      };

      const explain = (error) =>
        error instanceof TypeError
          ? `${error.message}. Causas: el agente no está encendido, el origen ${location.origin} no está en AGENT_ALLOWED_ORIGINS, o el navegador bloqueó la petición (CORS / red privada).`
          : String(error);

      async function health() {
        try {
          const response = await fetch(`${base()}/health`);
          show('GET /health', await response.json(), response.ok);
        } catch (error) { show('GET /health', explain(error), false); }
      }

      async function send(label, blob) {
        try {
          // audio/wav is not a CORS-safelisted type: this POST triggers a preflight
          const response = await fetch(`${base()}/transcribe`, { method: 'POST', headers: { 'content-type': 'audio/wav' }, body: blob });
          show(label, await response.json(), response.ok);
        } catch (error) { show(label, explain(error), false); }
      }

      $('health').addEventListener('click', health);
      $('silence').addEventListener('click', () => send('POST /transcribe (silencio)', wavOfSilence(1)));
      $('file').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) send(`POST /transcribe (${file.name})`, file);
      });

      if (new URLSearchParams(location.search).has('auto')) {
        await health();
        await send('POST /transcribe (silencio)', wavOfSilence(1));
        document.body.dataset.done = '1';
      }
    </script>
  </body>
</html>

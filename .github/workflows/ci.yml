name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build:web

  integration:
    # mongo:8 does not start on kernels >= 6.19 (SERVER-121912), which ubuntu-latest now has
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: chessspeak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d chessspeak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet -u ci -p ci-password --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # throwaway credentials of the service containers above (not repository secrets)
      DATABASE_URL_TEST: postgresql://ci:ci-password@localhost:5432/chessspeak_test
      MONGO_URI_TEST: mongodb://ci:ci-password@localhost:27017/chessspeak_test?authSource=admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter ./server prisma:generate
      - name: Run integration tests
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee integration.log
      - name: Check that tests actually ran
        run: |
          grep -E '^\s*Tests:' integration.log
          if grep -E '^\s*Tests:' integration.log | grep -q failed; then exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of the linux_x64 tarball, checked against the release's own checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose .'

  # Headless Chrome on the runner can be flaky: informational, does not block merging.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm smoke:web
        env:
          CHROME_PATH: /usr/bin/google-chrome

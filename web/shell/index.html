<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChessSpeak</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <div class="cs-decor" aria-hidden="true">
      <div class="cs-decor-checker"></div>
      <span class="cs-decor-knight">&#x265E;&#xFE0E;</span>
      <span class="cs-decor-pawn cs-p1">&#x265F;&#xFE0E;</span>
      <span class="cs-decor-pawn cs-p2">&#x265F;&#xFE0E;</span>
      <span class="cs-decor-fallen">&#x265A;&#xFE0E;</span>
      <span class="cs-decor-king">&#x265A;&#xFE0E;</span>
    </div>
    <header class="cs-header">
      <strong class="cs-brand"><span class="cs-logo" aria-hidden="true">&#x265E;&#xFE0E;</span>ChessSpeak</strong>
      <span class="cs-divider" aria-hidden="true"></span>
      <nav class="cs-nav"><a href="#/" data-nav="home">Inicio</a> <a href="#/game/demo" data-nav="demo">Partida de ejemplo</a> <a href="#/ranking" data-nav="ranking">Ranking</a></nav>
      <section id="cs-session" class="cs-session"></section>
    </header>
    <main id="cs-main">
      <!-- above the section head: the board controls sit on that line, at the top of .cs-layout -->
      <section id="cs-lobby" class="cs-lobby" aria-label="Partidas abiertas" hidden></section>
      <div class="cs-section-head">
        <p id="cs-route" class="cs-route"></p>
        <span class="cs-rule" aria-hidden="true"></span>
      </div>
      <div class="cs-layout">
        <section data-mf="mf-game" class="cs-slot"></section>
        <section data-mf="mf-voice-input" class="cs-slot"></section>
        <section data-mf="mf-history" class="cs-slot"></section>
      </div>
      <section data-mf="mf-ranking" class="cs-slot cs-ranking"></section>
    </main>
    <script src="./config.js"></script>
    <script type="module" src="./shell.js"></script>
  </body>
</html>
